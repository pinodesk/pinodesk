name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run gitflow release
        run: ./mvnw --batch-mode -s .m2/settings.xml gitflow:release -DversionDigitToIncrement=1
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

  build-linux:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate application.properties
        run: cp src/main/resources/application.properties.example src/main/resources/application.properties

      - name: Build DEB package
        run: ./mvnw --batch-mode -s .m2/settings.xml clean package -Pdeb -B
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          JDBC_USER: ${{ secrets.JDBC_USER }}
          JDBC_PASSWORD: ${{ secrets.JDBC_PASSWORD }}
          PINODESK_API_BASE_URL: ${{ secrets.PINODESK_API_BASE_URL }}

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinodesk-linux-deb
          path: target/*.deb

  build-windows:
    needs: release
    runs-on: windows-2022
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate application.properties
        run: copy src\main\resources\application.properties.example src\main\resources\application.properties
        shell: cmd

      - name: Build Windows installer
        run: ./mvnw --batch-mode -s .m2/settings.xml clean package -Pexe -B
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          JDBC_USER: ${{ secrets.JDBC_USER }}
          JDBC_PASSWORD: ${{ secrets.JDBC_PASSWORD }}
          PINODESK_API_BASE_URL: ${{ secrets.PINODESK_API_BASE_URL }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinodesk-windows-exe
          path: target/*.exe

  create-release:
    needs: [release, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: v${{ needs.release.outputs.tag }}
          files: |
            artifacts/pinodesk-linux-deb/*.deb
            artifacts/pinodesk-windows-exe/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Mirror to GitLab
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --bare /tmp/pinodesk-mirror.git
          cd /tmp/pinodesk-mirror.git

          git remote add github \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/pinodesk/pinodesk.git"

          git fetch --prune github \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          git push --prune gitlab \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
