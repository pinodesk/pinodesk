name: CI

on:
  workflow_dispatch:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: snapshot
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate application.properties
        run: cp src/main/resources/application.properties.example src/main/resources/application.properties

      - name: Build and test
        run: ./mvnw -s .m2/settings.xml --batch-mode spotless:check pmd:check test-compile verify -U
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          JDBC_USER: ${{ secrets.JDBC_USER }}
          JDBC_PASSWORD: ${{ secrets.JDBC_PASSWORD }}
          PINODESK_API_BASE_URL: ${{ secrets.PINODESK_API_BASE_URL }}
          JAVA_OPTS: >-
            -Djava.awt.headless=true
            -Dtestfx.headless=true
            -Dprism.order=sw
            -Dglass.platform=Monocle

      - name: Analyze with SonarCloud
        run: ./mvnw -s .m2/settings.xml --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Mirror to GitLab
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --bare /tmp/pinodesk-mirror.git
          cd /tmp/pinodesk-mirror.git

          git remote add github \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/pinodesk/pinodesk.git"

          git fetch --prune github \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          git push --prune gitlab \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

  build-linux:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate application.properties
        run: cp src/main/resources/application.properties.example src/main/resources/application.properties

      - name: Build DEB package
        run: ./mvnw --batch-mode -s .m2/settings.xml clean package -Pdeb -B
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          JDBC_USER: ${{ secrets.JDBC_USER }}
          JDBC_PASSWORD: ${{ secrets.JDBC_PASSWORD }}
          PINODESK_API_BASE_URL: ${{ secrets.PINODESK_API_BASE_URL }}

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinodesk-linux-deb
          path: target/*.deb
          retention-days: 7

  build-windows:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate application.properties
        run: copy src\main\resources\application.properties.example src\main\resources\application.properties
        shell: cmd

      - name: Build Windows installer
        run: ./mvnw --batch-mode -s .m2/settings.xml clean package -Pexe -B
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          JDBC_USER: ${{ secrets.JDBC_USER }}
          JDBC_PASSWORD: ${{ secrets.JDBC_PASSWORD }}
          PINODESK_API_BASE_URL: ${{ secrets.PINODESK_API_BASE_URL }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinodesk-windows-exe
          path: target/*.exe
          retention-days: 7
