name: CI

on:
  workflow_dispatch:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: ./mvnw -s .m2/settings.xml --batch-mode spotless:check pmd:check test-compile verify -U
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Analyze with SonarCloud
        run: ./mvnw -s .m2/settings.xml --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Mirror to GitLab
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git init --bare /tmp/pinodesk-mirror.git
          cd /tmp/pinodesk-mirror.git

          git remote add github \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/pinodesk/pinodesk.git"

          git fetch --prune github \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          git push --prune gitlab \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
